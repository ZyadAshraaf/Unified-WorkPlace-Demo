# Render.com Blueprint — free deploy of the Unified Workspace demo.
# In Render: New → Blueprint → connect this repo. Render reads this file,
# provisions a free web service, runs `npm install`, then `npm start`.
# The app binds to Render's injected $PORT automatically (server.js reads process.env.PORT).
services:
  - type: web
    name: unified-workspace-demo
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Optional — only needed for the AI chat features (HR Chat / Leave Assistant).
      # Add your key in the Render dashboard; the rest of the app runs without it.
      - key: GROQ_API_KEY
        sync: false
